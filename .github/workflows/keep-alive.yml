name: Supabase keep-alive

# Free Supabase projects pause after 7 consecutive days with no API activity.
# This workflow pings the REST API on a schedule so the inactivity timer never
# expires, keeping the project awake at $0 cost. It can also be run manually
# from the Actions tab (Run workflow).

on:
  schedule:
    # Runs once a day at 12:00 UTC. A single missed/delayed run still leaves
    # ~6 days of buffer before the project would pause.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://zoaimvqswzljyxnggonp.supabase.co/rest/v1/leagues?select=id&limit=1"
          KEY="sb_publishable_3bCKh56FWvlt_HSmbQ4oxg_vtRFMy-D"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL")
          echo "HTTP status: $code"
          # 200 (rows) and 206 (partial) both mean the DB served the request.
          # Row-level security may return an empty array to the anon key; that
          # still counts as activity, which is all we need.
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "Unexpected status $code — the ping may not have kept the project awake."
            exit 1
          fi
          echo "Keep-alive ping succeeded."
